parameters:
    app.prototype_event_table: 'messenger_prototype_events'
    app.prototype_failure_table: 'messenger_prototype_failures'
    app.file_storage_root: '%kernel.project_dir%/var/storage'
    app.file_storage_max_bytes: 10485760
    app.base_url: '%env(APP_BASE_URL)%'
    app.mail_from: 'no-reply@sovereignstack.local'
    app.html_sanitizer_force_https: true

services:
    _defaults:
        autowire: true
        autoconfigure: true

    SovereignStack\Lms\:
        resource: '../src/'
        exclude:
            - '../src/Shared/Domain/'
            - '../src/Shared/Application/Exception/'
            - '../src/Shared/Application/Storage/'
            - '../src/Shared/Application/Transaction/'
            - '../src/Shared/Infrastructure/Messenger/Message/'
            - '../src/Kernel.php'

    SovereignStack\Lms\Shared\Domain\Uuid\UuidGeneratorInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Uuid\SymfonyUidUuidGenerator

    SovereignStack\Lms\Shared\Domain\Clock\ClockInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Clock\SystemClock

    SovereignStack\Lms\Shared\Application\Transaction\TransactionManagerInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Persistence\DbalTransactionManager
        public: true

    SovereignStack\Lms\Shared\Application\Storage\FileStorageInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Storage\LocalFileStorage
        public: true

    SovereignStack\Lms\Shared\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $rootDirectory: '%app.file_storage_root%'
            $maxBytes: '%app.file_storage_max_bytes%'

    SovereignStack\Lms\Identity\Domain\Repository\UserRepositoryInterface:
        alias: SovereignStack\Lms\Identity\Infrastructure\Persistence\DBALUserRepository

    SovereignStack\Lms\Identity\Domain\Repository\UserProfileRepositoryInterface:
        alias: SovereignStack\Lms\Identity\Infrastructure\Persistence\DBALUserProfileRepository

    SovereignStack\Lms\Identity\Domain\Repository\UserTokenRepositoryInterface:
        alias: SovereignStack\Lms\Identity\Infrastructure\Persistence\DBALUserTokenRepository

    SovereignStack\Lms\Identity\Domain\Repository\RoleRepositoryInterface:
        alias: SovereignStack\Lms\Identity\Infrastructure\Persistence\DBALRoleRepository

    SovereignStack\Lms\Course\Domain\Repository\CourseRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALCourseRepository

    SovereignStack\Lms\Course\Domain\Repository\CourseVersionRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALCourseVersionRepository

    SovereignStack\Lms\Course\Domain\Repository\CourseModuleRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALCourseModuleRepository

    SovereignStack\Lms\Course\Domain\Repository\LessonRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALLessonRepository

    SovereignStack\Lms\Course\Domain\Repository\LessonContentRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALLessonContentRepository

    SovereignStack\Lms\Course\Domain\Repository\CourseCategoryRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALCourseCategoryRepository

    SovereignStack\Lms\Course\Domain\Repository\CourseInstructorRepositoryInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Persistence\DBALCourseInstructorRepository

    SovereignStack\Lms\Enrollment\Domain\Repository\EnrollmentRepositoryInterface:
        alias: SovereignStack\Lms\Enrollment\Infrastructure\Persistence\DBALEnrollmentRepository

    SovereignStack\Lms\Enrollment\Domain\Repository\CourseCompletionRepositoryInterface:
        alias: SovereignStack\Lms\Enrollment\Infrastructure\Persistence\DBALCourseCompletionRepository

    SovereignStack\Lms\Enrollment\Application\Contract\EnrollmentCourseContentInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\CourseContentAdapter

    SovereignStack\Lms\Enrollment\Application\Contract\EnrollmentCourseViewProviderInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\EnrollmentCourseViewProvider

    SovereignStack\Lms\Enrollment\Application\Contract\MembershipInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\MembershipCheckerAdapter

    SovereignStack\Lms\Enrollment\Application\Contract\LearningProgressInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\LearningProgressAdapter

    SovereignStack\Lms\Enrollment\Application\Contract\LessonProgressRecorderInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\LessonProgressRecorderAdapter

    SovereignStack\Lms\Enrollment\Application\Contract\ProgressStatusInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\ProgressStatusAdapter

    SovereignStack\Lms\Enrollment\Application\Contract\CompletionErrorsInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\CompletionErrorsAdapter

    SovereignStack\Lms\Enrollment\Application\Contract\PermissionCheckerInterface:
        alias: SovereignStack\Lms\Enrollment\Application\Contract\PermissionCheckerAdapter

    SovereignStack\Lms\Learning\Domain\Repository\LessonProgressRepositoryInterface:
        alias: SovereignStack\Lms\Learning\Infrastructure\Persistence\DBALLessonProgressRepository

    SovereignStack\Lms\Learning\Domain\Repository\ModuleProgressRepositoryInterface:
        alias: SovereignStack\Lms\Learning\Infrastructure\Persistence\DBALModuleProgressRepository

    SovereignStack\Lms\Learning\Application\Contract\RequiredModulesInterface:
        alias: SovereignStack\Lms\Learning\Application\Contract\RequiredModulesAdapter

    SovereignStack\Lms\Learning\Application\Contract\ProgressInterface:
        alias: SovereignStack\Lms\Learning\Application\Progress

    SovereignStack\Lms\Learning\Application\Contract\LessonProgressRecorderInterface:
        alias: SovereignStack\Lms\Learning\Application\LessonProgressRecorder

    SovereignStack\Lms\Learning\Application\Contract\LearningProgressInterface:
        alias: SovereignStack\Lms\Learning\Infrastructure\LearningProgress

    SovereignStack\Lms\Course\Application\Contract\HtmlSanitizerInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\Security\SymfonyHtmlSanitizer

    SovereignStack\Lms\Course\Application\Contract\PermissionCheckerInterface:
        alias: SovereignStack\Lms\Course\Application\Contract\PermissionCheckerAdapter

    SovereignStack\Lms\Course\Application\Contract\CourseContentProviderInterface:
        alias: SovereignStack\Lms\Course\Infrastructure\CourseContentProvider

    SovereignStack\Lms\Organisation\Application\Contract\MembershipCheckerInterface:
        alias: SovereignStack\Lms\Organisation\Application\MembershipChecker

    SovereignStack\Lms\Shared\Application\Outbox\OutboxWriterInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Outbox\DbalOutboxWriter

    SovereignStack\Lms\Course\Infrastructure\Security\SymfonyHtmlSanitizer:
        arguments:
            $forceHttps: '%app.html_sanitizer_force_https%'

    SovereignStack\Lms\Organisation\Application\Contract\UserOrganisationsInterface:
        alias: SovereignStack\Lms\Organisation\Application\Contract\UserOrganisationsAdapter

    SovereignStack\Lms\Course\Application\Contract\UserOrganisationsInterface:
        alias: SovereignStack\Lms\Course\Application\Contract\UserOrganisationsAdapter

    SovereignStack\Lms\Organisation\Domain\Repository\OrganisationRepositoryInterface:
        alias: SovereignStack\Lms\Organisation\Infrastructure\Persistence\DBALOrganisationRepository

    SovereignStack\Lms\Organisation\Domain\Repository\MembershipRepositoryInterface:
        alias: SovereignStack\Lms\Organisation\Infrastructure\Persistence\DBALMembershipRepository

    SovereignStack\Lms\Shared\Application\Audit\AuditLoggerInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Audit\DbalAuditLogger

    SovereignStack\Lms\Shared\Application\Mail\AccountMailerInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Mail\SymfonyAccountMailer

    SovereignStack\Lms\Shared\Application\Token\TokenGeneratorInterface:
        alias: SovereignStack\Lms\Shared\Infrastructure\Token\RandomTokenGenerator

    SovereignStack\Lms\Shared\Infrastructure\Mail\SymfonyAccountMailer:
        arguments:
            $baseUrl: '%app.base_url%'
            $mailFrom: '%app.mail_from%'

    SovereignStack\Lms\Identity\Application\Contract\PasswordHasherInterface:
        alias: SovereignStack\Lms\Identity\Infrastructure\Security\SymfonyPasswordHasher

    SovereignStack\Lms\Identity\Application\Contract\PermissionCheckerInterface:
        alias: SovereignStack\Lms\Identity\Application\Security\PermissionChecker

    SovereignStack\Lms\Organisation\Application\Contract\PermissionCheckerInterface:
        alias: SovereignStack\Lms\Organisation\Application\Contract\PermissionCheckerAdapter

    SovereignStack\Lms\Shared\Infrastructure\Logging\CorrelationIdProcessor:
        autoconfigure: false
        tags:
            - { name: monolog.processor }
