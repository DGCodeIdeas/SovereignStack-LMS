security:
    password_hashers:
        SovereignStack\Lms\Identity\Infrastructure\Security\PasswordUser: 'auto'
        SovereignStack\Lms\Identity\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        app_user_provider:
            id: SovereignStack\Lms\Identity\Infrastructure\Security\DbalUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        # Test-only probe routes registered by config/services_test.yaml.
        - { path: ^/_test, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/ready, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify/email, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/assets, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
