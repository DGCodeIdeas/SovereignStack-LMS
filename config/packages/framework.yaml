framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    asset_mapper:
        enabled: false

when@dev:
    framework:
        profiler:
            only_exceptions: false
            collect_serializer_data: true

when@test:
    framework:
        session:
            storage_factory_id: session.storage.factory.mock_file
